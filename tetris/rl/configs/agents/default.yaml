# Default PPO agent configuration
# This config defines hyperparameters and model architecture for training

# Algorithm
algorithm: "PPO"
policy: "MlpPolicy"  # MlpPolicy, CnnPolicy, etc.

# Learning hyperparameters
learning_rate: 3.0e-4
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma: 0.99  # Discount factor

# Policy network architecture
# For MlpPolicy, this defines hidden layer sizes
policy_kwargs:
  net_arch:
    - 64
    - 64
  activation_fn: "tanh"

# PPO-specific parameters
clip_range: 0.2
ent_coef: 0.01  # Entropy coefficient for exploration
vf_coef: 0.5   # Value function coefficient
max_grad_norm: 0.5

# Training settings
verbose: 1
tensorboard_log: "./rl_logs/tensorboard"

# Device
device: "auto"  # "auto", "cpu", "cuda"
